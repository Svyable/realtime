source: Long public-domain rains chosen to sit under an hour of music
checked: '2026-10-13'
note: The curated nature beds are a minute or two. These three are the steady
  takes, long enough that an hour does not keep returning to the same moment.
  Public Domain Mark on radio aporee. Fairbanks is the even first 32 minutes of
  a 45-minute recording. The rain thickens after that.
