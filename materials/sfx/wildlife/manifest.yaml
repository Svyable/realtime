source: Public-domain night wildlife, mostly the northeastern spring chorus
checked: '2026-10-12'
note: Spring peepers are the New Hampshire April night. These choruses were recorded
  in New York, Pennsylvania, Ohio, Michigan, and Ontario by the people who released
  them under the Public Domain Mark, plus one U.S. National Park Service loon. The
  two cricket beds already in materials/sfx/nature are Mexico and Poland. The field
  cricket here is Utah. Peepers and crickets do not sing in the same month.
