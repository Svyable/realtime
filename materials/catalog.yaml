engines:
  - id: composer
    license: MIT
    what: Original jazz-ballad piano as MIDI. Moods, seeds, and titles. No quoted songs.
  - id: carols
    license: Public domain tunes, generated reharmonisation
    what: Named in music.carols. Each bar fills the meter. See realtime.music.carols.
  - id: fluidsynth
    license: LGPL-2.1
    what: Renders the piano. Install it on PATH. The soundfont is FreePats Upright Piano KW, CC0, via `realtime setup`.
  - id: ffmpeg
    license: Your ffmpeg build
    what: Encodes the hour and measures loudness.
  - id: edsr-x2
    license: Apache-2.0
    what: Optional plate upscaler. Lanczos is used when the weights are absent. `realtime setup` fetches them.
  - id: visual-loop
    license: MIT
    what: One still becomes a seamless loop. Motions none, gentle, train, ship. Effects include flicker (lamp, candle, fire), rain on glass, snow, shimmer, twinkle, parallax.

reservoir:
  - id: pdsounds
    license: Public domain
    path: materials/sfx/pdsounds
    manifest: materials/sfx/pdsounds/manifest.yaml
    upstream: https://commons.wikimedia.org/wiki/Category:PDsounds.org
    note: Environmental draw-pile from PDSounds.org, mirrored on Wikimedia Commons. Commons lists 592 public-domain ogg files. This folder is the weather, water, nature, town, transit, and interior slice. Speech, music, and close-miked foley were not copied. Audition a file before it sits under the piano.

wildlife:
  - id: northeastern-night
    path: materials/sfx/wildlife
    manifest: materials/sfx/wildlife/manifest.yaml
    credits: materials/sfx/wildlife/CREDITS.md
    checked: "2026-10-12"
    note: Spring peepers, wood frogs, leopard frogs, a twenty-minute Ontario night with tree frogs and loons, common loons from Bray Lake, the Boundary Waters, Yellowstone, and the U.S. Fish and Wildlife Service, and a Salt Lake field cricket. Public Domain Mark, plus U.S. government works and one PDSounds call. None of the peeper or loon files were recorded in New Hampshire. Peepers (April) and crickets (summer) do not sing in the same month. Katydids, American toads, whip-poor-wills, and barred owls stayed out because the clean files found were CC-BY or CC-BY-SA.

loops:
  - id: long-rain
    path: materials/sfx/loops
    manifest: materials/sfx/loops/manifest.yaml
    credits: materials/sfx/loops/CREDITS.md
    checked: "2026-10-13"
    note: Three public-domain rains long enough to sit under an hour of music. A twenty-minute midnight rain in Serrinha do Alambari, sixteen minutes of rain in a Barcelona window, and thirty-two even minutes of late-summer rain in Fairbanks. The shorter nature beds stay in materials/sfx/nature.

mixing:
  - Two bed layers is the usual ceiling. The piano leads. Default bed is 10 LU under the piano. Most kits use 11 or 12. The peeper kit uses 7 so the chorus is close enough to sleep to, and the piano still leads.
  - Weather can be brighter than the piano. A closed door is about 1.1 kHz on the piano. Rain and fire stay higher than that, or the room sounds muffled.
  - Thunder and whistles are accents. per_hour, a short clip, extra_lu_below so they never sit on the melody.

do_not_add:
  - BBC RemArc and any other non-commercial sound library
  - CC-BY, CC-BY-SA, CC-BY-NC, CC-BY-ND, or any ShareAlike, NonCommercial, or NoDerivatives recording
  - Freesound CDN originals. A Wikimedia Commons mirror of a CC0 upload is fine, and it needs a checked sha256
  - A modern copyrighted arrangement of a public-domain tune
  - A western chorus frog, a boreal chorus frog, or a Yellowstone species labeled as a New Hampshire spring peeper
  - Video masters, wav renders, or any file that needs Git LFS. Renders stay in ./media
