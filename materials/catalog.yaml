# Agent index for realtime. Print it with `realtime materials`.
# Every recording here is CC0 or public domain. Tunes are public domain; the piano
# arrangement is generated by this package and is not a copy of a modern chart.
# Build Yule Love from a clone:
#   realtime kit yule-love
#   realtime build scenes/yule-love/scene.yaml --root . --test

kits:
  - id: yule-love
    offline: true
    picture: Christmas parlor at night. Hearth left, one lamp right, snow in the window. No people, no text.
    music: holiday. Originals titled Yule Love, The Lamp Between Us, Snow on the Sill. Carols greensleeves (the What Child Is This tune), the-water-is-wide, silent-night, auld-lang-syne.
    sound: Piano through an open doorway. Hearth at full bed share, open-field wind 6 dB down and duller. The room sits 11 LU under the piano.
  - id: hearth-rain
    offline: true
    picture: Evening room, rain on the right-hand window, fire low on the left.
    music: evening originals. No carols.
    sound: Morning-rain-through-a-window plus the hearth, 11 LU under the piano.
  - id: summer-porch
    offline: true
    picture: Wooden porch at dusk, one lamp, a dark lane.
    music: evening originals.
    sound: Night crickets with far surf, alone, 11 LU under the piano.
  - id: cove-window
    offline: true
    picture: Dark room, wide window, calm water in the lower half of the glass.
    music: late-night originals.
    sound: Gentle cove, low-passed, 12 LU under the piano, with a shimmer on the water.
  - id: parish-bells
    offline: true
    picture: Snowy lane, a far church with nothing readable, one candle.
    music: holiday. Carols coventry-carol, silent-night, o-come-all-ye-faithful.
    sound: Open-field wind plus the Leverkusen bells from the PDSounds reservoir, twice an hour, low-passed.
  - id: night-train
    offline: false
    picture: Mid-century dining car from the corridor, one lamp, no logos or faces.
    music: late-night originals.
    sound: Carriage wheels after `realtime setup --sfx`, low-passed hard, 11 LU under a closed door. The picture uses train motion.
  - id: peepers
    offline: true
    picture: Dark bedroom in April, one lamp, a black wetland beyond the window. No snow, no people, no text.
    music: late-night originals. After the Ice, The Marsh Below, Three Thirty.
    sound: One layer, the twenty-minute Ontario night (peepers, tree frogs, loons), 7 LU under the piano. About six times an hour, twenty seconds of loons from Bray Lake, Ontario. The piano still leads. No cricket layer. Both recordings are Ontario, the same season as a New Hampshire April.
  - id: loons
    offline: true
    picture: Dark room, one lamp, a black lake beyond the window. No snow, no people, no text.
    music: late-night originals. Across the Water, One Wail, The Far Shore.
    sound: One layer, twelve minutes of loons on Bray Lake, Ontario, the evening of 29 April 2026, 7 LU under the piano. A Yellowstone common-loon tremolo four times an hour. No cricket layer. Ontario and Yellowstone, the same species as a New Hampshire lake.
  - id: window-rain
    offline: true
    picture: Dark room at night, one lamp, rain on a wide window. No people, no text, no album covers.
    music: late-night originals. Rain on the Glass, The Record and the Weather, After the Street Goes Quiet.
    sound: One layer, sixteen minutes of rain in a Barcelona window, 10 LU under the piano. Swap the file for the Serrinha night rain or the Fairbanks summer rain when the picture is outdoors.

beds:
  - path: materials/sfx/nature/fire/fireplace_crackling-wood-fire_pd.mp3
    license: Public Domain Mark 1.0
    role: hearth
    note: Close wood fire. Leave some crackle. Pair with rain or a quiet wind.
  - path: materials/sfx/nature/wind/wind_open-field-gusts_cc0.mp3
    license: CC0 1.0
    role: soft wind
    note: Open-field gusts. The quiet outdoor layer for snow and parish scenes.
  - path: materials/sfx/nature/wind/wind_desert-sandstorm-at-window_pd.mp3
    license: Public Domain Mark 1.0
    role: wind at a window
    note: Sandstorm heard from indoors. Desert motel, diner at night.
  - path: materials/sfx/nature/wind/wind_mojave-desert-windstorm_pd.mp3
    license: Public Domain Mark 1.0
    role: hard wind
    note: Howling dawn wind. Has low thumps; high-pass if they poke through.
  - path: materials/sfx/nature/rain/rain_light-on-window_pd.mp3
    license: Public domain
    role: rain on glass
    note: Lo-fi mono rain and wind on a pane. Reading nook, vintage radio.
  - path: materials/sfx/nature/rain/rain_morning-through-open-window_pd.mp3
    license: Public Domain Mark 1.0
    role: rain outside
    note: Soft rain through an open window. The cozy-room bed.
  - path: materials/sfx/nature/rain/rain_heavy-on-plastic-roof_pd.mp3
    license: Public Domain Mark 1.0
    role: rain on a roof
    note: Close, bright, short. Low-pass it for a porch roof.
  - path: materials/sfx/nature/rain/rain_heavy-on-metal-door_pd.mp3
    license: Public Domain Mark 1.0
    role: hard rain
    note: Clean downpour on metal. Tin roof, garage, attic.
  - path: materials/sfx/nature/rain/rain_light-in-woods-distant-thunder_cc0.mp3
    license: CC0 1.0
    role: woods rain
    note: Gentle rain, one far roll of thunder, a bird. Cabin and lake house.
  - path: materials/sfx/nature/rain/rain_steady-downpour_cc0.mp3
    license: CC0 1.0
    role: steady rain
    note: Even downpour for a long loop under anything.
  - path: materials/sfx/nature/thunder/thunder_summer-storm-rolling_pd.mp3
    license: Public Domain Mark 1.0
    role: thunder event
    note: Not a bed. Use as an accent for a minute or two over steady rain.
  - path: materials/sfx/nature/ocean/ocean_gentle-waves-cove_pd.mp3
    license: Public Domain Mark 1.0
    role: calm sea
    note: Small cove. Late-night window cracked.
  - path: materials/sfx/nature/ocean/ocean_waves-on-sandy-beach_pd.mp3
    license: Public Domain Mark 1.0
    role: beach
    note: Full rhythmic surf. Seaside hotel, beach house.
  - path: materials/sfx/nature/ocean/ocean_strong-surf-windy-evening_pd.mp3
    license: Public Domain Mark 1.0
    role: storm coast
    note: Heavy windy surf. Low-pass hard so it stays beyond the walls.
  - path: materials/sfx/nature/crickets-night/crickets_night-chorus-distant-surf_pd.mp3
    license: Public Domain Mark 1.0
    role: summer night
    note: Dense night insects and far Pacific surf, Laguna Chacahua, Mexico. A summer bed. Often enough on its own.
  - path: materials/sfx/nature/crickets-night/crickets_panned-field-chorus_pd.mp3
    license: Public Domain Mark 1.0
    role: dusk field
    note: Lighter, drier, panned field chorus, Poznan, Poland. Short loop. A summer bed, not a peeper night.
  - path: materials/sfx/nature/birds/birds_forest-evening-song_cc0.mp3
    license: CC0 1.0
    role: evening birds
    note: Forest birdsong for dawn, golden hour, or an open garden window.
  - path: materials/sfx/nature/creek/creek_small-river-over-step_cc0.mp3
    license: CC0 1.0
    role: creek
    note: A small river over a step, faint birds and frogs.

