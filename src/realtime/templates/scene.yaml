# Copy with `realtime new <slug>`, drop keyframe.jpg in, then tune.
# Region coordinates are 0..1 of the 16:9 frame (x right, y down).
title: "Soft piano from the next room"
duration_min: 60
seed: 1
keyframe: keyframe.jpg

music:
  mood: late_night          # late_night | evening | daytime | morning | holiday
  titles: []

piano:
  distance: closed_door     # closed_door | hallway | open_doorway | same_room_soft | old_radio | radio_next_room
  pan: -0.2
  door: null                # e.g. {at_min: 34.5, open_lpf: 1800, hold_s: 120}

ambience:
  layers:
    - name: rain on the window
      file: assets/sfx/nature/rain/rain_light-on-window_pd.mp3
      lpf: 4500
      smooth: 0.5
      gain_db: 0
  accents: []

mix:
  bed_lu_below_piano: 10    # 8 = more room, 12 = piano further forward

visual:
  motion: {type: gentle}    # none | gentle | train | ship
  effects:
    - type: flicker
      kind: lamp
      center: [0.5, 0.42]
      radius: 0.15

thumbnail: {text: null, position: top-right}
