[project]
name = "realtime"
version = "0.1.0"
description = "One still and one scene file become a seamless hour of piano and room tone."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Svyable"}]
keywords = ["video", "ambience", "piano", "loop", "scene"]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6",
  "mido>=1.3",
  "scipy>=1.11",
  "soundfile>=0.12",
  "pyloudnorm>=0.1.1",
  "opencv-contrib-python-headless>=4.8",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
realtime = "realtime.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
realtime = ["music/data/*.json", "templates/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
